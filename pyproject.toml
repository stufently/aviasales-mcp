[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aviasales-mcp"
version = "0.5.0"
description = "MCP server for Aviasales/Travelpayouts Flight Search API"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Lower bound, not a pin: CI runs 3.12 and 3.13.
requires-python = ">=3.12"
authors = [
    { name = "aviasales-mcp contributors" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "aviasales",
    "travelpayouts",
    "flights",
    "flight-search",
    "travel",
    "airfare",
    "fastmcp",
    "llm-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.1,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    # Pulled in by fastmcp, but imported directly for the HTTP transport's auth
    # middleware, so it is declared here too.
    "starlette>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
aviasales-mcp = "aviasales_mcp.server:main"

[project.urls]
Homepage = "https://github.com/stufently/aviasales-mcp"
Repository = "https://github.com/stufently/aviasales-mcp"
Issues = "https://github.com/stufently/aviasales-mcp/issues"
Changelog = "https://github.com/stufently/aviasales-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aviasales_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["aviasales_mcp"]
