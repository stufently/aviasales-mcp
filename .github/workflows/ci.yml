name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so a tag runs this matrix rather than a copy of it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        # The suite mocks every HTTP call, so no API token is needed.
        run: pytest -q --cov=aviasales_mcp --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --target runtime -t aviasales-mcp .

      # What Glama and other directories do with the image: start it with no
      # token and no network, then list the tools over stdio.
      - name: Runtime image answers tools/list with no token and no network
        run: |
          name="aviasales-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 10
          } | timeout 60 docker run --name "$name" -i --network none aviasales-mcp > smoke.jsonl
          jq -c 'select(.id == 2) | [.result.tools[].name]' smoke.jsonl
          jq -e 'select(.id == 1) | .result.serverInfo.name == "Aviasales"' smoke.jsonl
          count=$(jq -r 'select(.id == 2) | .result.tools | length' smoke.jsonl)
          echo "tools: $count"
          [ "$count" = 13 ] || { echo "::error::expected 13 tools, got '$count'"; exit 1; }

      - name: Build dev image and run the suite inside it
        run: docker build --target dev -t aviasales-mcp-dev .

      - name: Test in image
        run: docker run --rm aviasales-mcp-dev pytest -q
