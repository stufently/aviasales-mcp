name: MCPB release assets

# Attaches the Desktop Extension to the GitHub Release for a v* tag.
# Does not publish to GHCR, the MCP registry, PyPI, or npm.
on:
  push:
    tags: ["v*"]

jobs:
  mcpb:
    name: Build and upload mcpb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build mcpb bundle
        run: bash scripts/build-mcpb.sh

      - name: Create the GitHub release when the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

      - name: Upload mcpb bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber
