[[faq]]
q = "How do I install Aviasales MCP?"
a = "Run the Docker image ghcr.io/stufently/aviasales-mcp:latest with AVIASALES_API_TOKEN in the environment, or without Docker run uvx aviasales-mcp (Python 3.12+). The README has ready configs for Claude Code, Claude Desktop, Cursor, Windsurf, Zed and Codex."

[[faq]]
q = "Which token do I need?"
a = "A free Travelpayouts API token from travelpayouts.com/programs/100/tools/api. A wrong or missing token still lets the process start; it surfaces as an error on the first search."

[[faq]]
q = "Are the prices live?"
a = "No. The Data API serves a cache of recent searches, not live availability. A fare can be gone by the time the link opens, and an empty result means nobody searched that route recently, not that the route does not exist."

[[faq]]
q = "Do prices include all passengers and the cabin class?"
a = "No. Prices are always per adult in economy. Passenger count and cabin class are encoded into each ticket's booking_link, which opens Aviasales with the full party pre-filled and shows the real total."

[[faq]]
q = "Can it book or buy tickets?"
a = "No. The server searches and links out; it never holds or buys a ticket. All thirteen tools are read-only."

[[faq]]
q = "Why does AVIASALES_MARKET matter?"
a = "The price cache is per market: the same route in the same currency comes back at a different price for ru and us. Unset, the server reads the ru market."
